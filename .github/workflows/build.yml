name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    env:
      # Where `ort` keeps the ONNX Runtime library it downloads (picture search, src/scenes).
      ORT_CACHE_DIR: ${{ github.workspace }}/.ort-cache
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: ONNX Runtime cache
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: .ort-cache
          key: ort-x86_64-unknown-linux-gnu-${{ hashFiles('Cargo.lock') }}
      # ort's build script links the library from ORT_CACHE_DIR and only runs again when ort changes.
      # A restored target folder with no library behind it would fail to link: build it afresh.
      - name: ONNX Runtime (download again with the build)
        if: steps.ort-cache.outputs.cache-hit != 'true'
        shell: bash
        run: find target -maxdepth 4 -type d \( -path '*/build/ort-sys-*' -o -path '*/.fingerprint/ort-sys-*' \) -prune -exec rm -rf {} + 2>/dev/null || true
      - name: System libraries
        run: |
          sudo apt-get update
          # cmake and libclang build whisper.cpp and its bindings (whisper-rs-sys); libssl-dev is for
          # ort's download of ONNX Runtime at build time (native TLS).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev ffmpeg cmake libclang-dev libssl-dev
      - run: pnpm install --frozen-lockfile
      # A release's tag and the app's version must agree: the updater compares the version, and the
      # installers are named after it. (Set it with `node scripts/version.mjs <version>`.)
      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version.mjs --check "$GITHUB_REF_NAME"
      - name: FFmpeg sidecars (the Tauri build checks they exist)
        run: node scripts/ffmpeg.mjs
      - run: pnpm typecheck
      - run: pnpm test
      - run: cargo test --workspace --locked

  app:
    name: App (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-15
            target: aarch64-apple-darwin
          - name: Windows (x64)
            os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      # tauri-action creates the draft release for a tag and uploads the installers to it.
      contents: write
    env:
      # whisper.cpp (speech to text) is built from source by whisper-rs-sys, which passes GGML_*
      # variables to its CMake build. Not tuned to the build machine's CPU: the app runs on
      # people's computers (x64 then needs AVX2, any PC since 2013; Macs get Metal).
      GGML_NATIVE: 'OFF'
      # Picture search (src/scenes) runs CLIP on ONNX Runtime, which `ort` links into the app
      # statically: its build script downloads Microsoft's prebuilt library for the target (pyke's
      # builds, checked by hash) into this folder. Nothing is bundled beside the app; on Windows the
      # DirectML DLLs it references are delay-loaded and never used (src-tauri/build.rs).
      ORT_CACHE_DIR: ${{ github.workspace }}/.ort-cache
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2
      - name: FFmpeg cache
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('scripts/ffmpeg.mjs') }}
      - name: ONNX Runtime cache
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: .ort-cache
          key: ort-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      # See the test job: without the library, ort's cached build output can't link.
      - name: ONNX Runtime (download again with the build)
        if: steps.ort-cache.outputs.cache-hit != 'true'
        shell: bash
        run: find target -maxdepth 4 -type d \( -path '*/build/ort-sys-*' -o -path '*/.fingerprint/ort-sys-*' \) -prune -exec rm -rf {} + 2>/dev/null || true
      - run: pnpm install --frozen-lockfile
      - name: FFmpeg sidecars
        run: node scripts/ffmpeg.mjs --target ${{ matrix.target }}
      # bindgen (whisper-rs-sys) needs libclang. The Windows image ships LLVM; install it if not,
      # and say where it is. CMake is on every runner; macOS uses Xcode's libclang.
      - name: LLVM for whisper.cpp's bindings (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvm\libclang.dll")) { choco install llvm -y --no-progress }
          "LIBCLANG_PATH=$llvm" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          cmake --version
      # Secrets that aren't set arrive as empty strings, and Tauri treats an empty
      # APPLE_CERTIFICATE as a certificate to sign with. Only pass the ones that exist.
      - name: Signing secrets (optional)
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID \
                      APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then
              delimiter="EOF_$(openssl rand -hex 8)"
              { echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"; } >> "$GITHUB_ENV"
              echo "Using $name"
            fi
          done
      # Updates (README › Releasing): the public key from the TAURI_UPDATER_PUBKEY variable goes into
      # tauri.conf.json, and signed updater bundles are made when TAURI_SIGNING_PRIVATE_KEY (exported
      # above) is set too. Without them the build works the same, and doesn't check for updates.
      - name: Updater setup
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: node scripts/updater-config.mjs
      # A release's notes (shown in the app's update alert, a change a line) are the tag's message:
      # `git tag -a v1.2.3 -m "…"`. Checkout leaves a tag lightweight, so it's fetched again whole.
      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git fetch --force --no-tags --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          notes=""
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = "tag" ]; then
            notes="$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" | sed '/^-----BEGIN /,$d')"
          fi
          delimiter="EOF_$(openssl rand -hex 8)"
          { echo "notes<<$delimiter"; echo "$notes"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: PromptEdit ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.notes }}
          # A draft until every platform is in it: the release job below publishes it, with latest.json.
          releaseDraft: true
          includeUpdaterJson: false
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: PromptEdit-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error

  # A tag's release goes public once both platforms built: latest.json (the updater's manifest, every
  # platform in one file) is made from the uploaded bundles, each signature checked against the key the
  # apps trust, and the draft is published as the latest release. Apps check
  # https://github.com/<repo>/releases/latest/download/latest.json, which only sees published releases.
  release:
    name: Publish release
    needs: app
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Updater manifest (latest.json)
        if: vars.TAURI_UPDATER_PUBKEY != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          node scripts/latest-json.mjs --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --require darwin-aarch64,windows-x86_64 --out latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber --repo "$GITHUB_REPOSITORY"
      - name: No updater key
        if: vars.TAURI_UPDATER_PUBKEY == ''
        run: echo "::warning::TAURI_UPDATER_PUBKEY isn't set, so this release has no latest.json and apps won't be offered it. See README › Releasing."
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A pre-release tag (v1.2.0-beta.1) is published as a pre-release, which releases/latest (so
        # the updater) passes by; anything else becomes the latest release, and apps are offered it.
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          fi
