[package]
default-run = "promptedit"
name = "promptedit"
version.workspace = true
description = "PromptEdit video editor"
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "promptedit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
promptedit-core = { path = "../crates/core" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "io-util", "fs"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

# MCP server, agent connect and Magic (src/mcp, src/agents.rs, src/magic).
base64 = "0.22"
dirs = "6"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
regex = "1"
reqwest = { version = "0.13", features = ["rustls", "stream", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"

# Speech to text on this computer (src/transcribe): whisper.cpp, built from source by whisper-rs-sys.
whisper-rs = "0.16"

# Metal (GPU) for whisper on Macs; Windows and Linux run it on the CPU.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[[bin]]
name = "promptedit"
path = "src/main.rs"

[[bin]]
name = "devserver"
path = "src/bin/devserver.rs"
